<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (id) => document.getElementById(id);
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('is-touch');

/* ---------- deterministic randomness + noise ---------- */
let seed = 23;
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const rr = (a, b) => a + (b - a) * rand();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; };
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * 0.55 + vnoise(x * 2.1, y * 2.1) * 0.3 + vnoise(x * 4.3, y * 4.3) * 0.15;

/* ---------- terrain layout ---------- */
// The river runs down the meadow (from the top of the screen), drops over a rock lip into a pool cut
// below the meadow, then leaves as a stream toward the bottom-right.
const RIVER = [[5.2, -44], [7.4, -30], [5.0, -18], [6.6, -9], [6.5, -3]];
const STREAM = [[6.5, 1.5], [11, 8], [17, 13], [23, 19], [31, 26], [44, 36]];
const POOL = { x: 6.5, z: 1.5, r: 5.2 };
const RIVER_Y = 1.5, POOL_Y = -1.2;
function segDist(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz), 0, 1);
  return Math.hypot(px - ax - dx * t, pz - az - dz * t);
}
function lineDist(pts, x, z) { let d = 1e9; for (let i = 0; i < pts.length - 1; i++) d = Math.min(d, segDist(x, z, ...pts[i], ...pts[i + 1])); return d; }
const riverD = (x, z) => lineDist(RIVER, x, z) - 2.1 + (vnoise(x * 0.4, z * 0.4) - 0.5) * 0.9;
function basinD(x, z) {
  const w = (vnoise(x * 0.35 + 7, z * 0.35) - 0.5) * 1.6;
  return Math.min(Math.hypot(x - POOL.x, z - POOL.z) - POOL.r, lineDist(STREAM, x, z) - 3.0 - 0.6 * smooth(0, 30, z)) + w;
}
function H(x, z) {
  let h = 2.45 + (fbm(x * 0.045 + 3, z * 0.045 + 1) - 0.5) * 1.5 + (vnoise(x * 0.3, z * 0.3) - 0.5) * 0.12;
  const rd = riverD(x, z);
  h = lerp(h, 0.85 - smooth(0, 1.5, -rd) * 0.25, 1 - smooth(-0.3, 0.7, rd));
  const bd = basinD(x, z);
  const floorY = -1.75 - smooth(0, 2.2, -bd) * 1.0;
  h = lerp(h, floorY, 1 - smooth(-0.7, 0.35, bd));
  return h;
}
const slopeAt = (x, z) => Math.hypot(H(x + 0.2, z) - H(x - 0.2, z), H(x, z + 0.2) - H(x, z - 0.2)) / 0.4;
const EXT = { x0: -36, z0: -42, w: 82, d: 82 };

/* ---------- renderer / scene ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#7fb24a');
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 220);
const CAM_OFF = new THREE.Vector3(0, 20, 10.5);
let zoom = 1;
const aspectZoom = () => (innerWidth < innerHeight ? 1 + (1 - innerWidth / innerHeight) * 1.1 : 1);

scene.add(new THREE.HemisphereLight('#eef8ff', '#5d7d36', 1.2));
const sun = new THREE.DirectionalLight('#fff0d0', 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 80 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(-14, 26, -11);

const uTime = { value: 0 };
const uPlayer = { value: new THREE.Vector2(0, 0) };

/* ---------- terrain mesh with painted vertex colours ---------- */
{
  const g = new THREE.PlaneGeometry(EXT.w, EXT.d, 300, 300);
  g.rotateX(-Math.PI / 2);
  g.translate(EXT.x0 + EXT.w / 2, 0, EXT.z0 + EXT.d / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, H(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const n = g.attributes.normal;
  const col = new Float32Array(p.count * 3);
  const c = new THREE.Color(), grassA = new THREE.Color('#7fb24a'), grassB = new THREE.Color('#5f9638'), grassC = new THREE.Color('#9cc35a');
  const rock = new THREE.Color('#8e959a'), rockD = new THREE.Color('#6f777c'), sand = new THREE.Color('#d6caa0'), bed = new THREE.Color('#a8a683'), moss = new THREE.Color('#7f9a4c');
  const tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), ny = n.getY(i);
    const v = fbm(x * 0.12, z * 0.12);
    c.copy(grassA).lerp(grassB, smooth(0.45, 0.7, v)).lerp(grassC, smooth(0.55, 0.3, fbm(x * 0.05 + 9, z * 0.05)) * 0.6);
    // rock on steep faces, with soft horizontal strata
    tmp.copy(rock).lerp(rockD, 0.5 + 0.5 * Math.sin(y * 5.5 + vnoise(x, z) * 2));
    const rockAmt = smooth(0.86, 0.62, ny);
    c.lerp(tmp, rockAmt);
    if (rockAmt > 0.2 && ny > 0.55) c.lerp(moss, 0.35 * smooth(0.55, 0.8, ny));
    // river bed, shore and pool floor
    if (y < 1.35 && ny > 0.6) c.lerp(bed, smooth(1.35, 1.0, y));
    if (y < -0.9 && ny > 0.55) c.lerp(sand, smooth(-0.9, -1.4, y));
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const ground = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
  ground.receiveShadow = true;
  scene.add(ground);
}

/* ---------- height texture so the water knows its depth ---------- */
const HT = 384;
const heightTex = (() => {
  const data = new Uint16Array(HT * HT);
  for (let j = 0; j < HT; j++) for (let i = 0; i < HT; i++) {
    const x = EXT.x0 + (i + 0.5) / HT * EXT.w, z = EXT.z0 + (j + 0.5) / HT * EXT.d;
    data[j * HT + i] = THREE.DataUtils.toHalfFloat(H(x, z));
  }
  const t = new THREE.DataTexture(data, HT, HT, THREE.RedFormat, THREE.HalfFloatType);
  t.magFilter = t.minFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
})();

/* ---------- water ---------- */
const NOISE_GLSL = `
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec2 hash2(vec2 p){ return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
vec2 voronoi(vec2 p, float t){ vec2 n = floor(p), f = fract(p); float f1 = 8.0, f2 = 8.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j)); vec2 o = hash2(n + g); o = 0.5 + 0.5 * sin(t + 6.2831 * o);
    float d = length(g + o - f); if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d; }
  return vec2(f1, f2); }
`;
function waterMaterial({ level, flow, fall, deepen }) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: {
      uTime, uH: { value: heightTex }, uExt: { value: new THREE.Vector4(EXT.x0, EXT.z0, EXT.w, EXT.d) },
      uLevel: { value: level }, uFlow: { value: new THREE.Vector2(...flow) }, uFall: { value: new THREE.Vector3(...fall) },
      uDeepen: { value: deepen }, uCam: { value: camera.position },
    },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `
      uniform sampler2D uH; uniform vec4 uExt; uniform float uTime, uLevel, uDeepen; uniform vec2 uFlow; uniform vec3 uFall, uCam;
      varying vec3 vW;
      ${NOISE_GLSL}
      void main(){
        float th = texture2D(uH, (vW.xz - uExt.xy) / uExt.zw).r;
        float depth = uLevel - th;
        if (depth < -0.02) discard;
        vec2 fp = vW.xz - uFlow * uTime;
        float n1 = noise(fp * 0.7), n2 = noise(fp * 2.3 + 3.7);
        // surface normal from scrolling noise for small sun glints
        float e = 0.1;
        float hA = noise(fp * 1.6) + noise(fp * 3.4 + 1.3) * 0.5;
        float hX = noise((fp + vec2(e, 0.0)) * 1.6) + noise((fp + vec2(e, 0.0)) * 3.4 + 1.3) * 0.5;
        float hZ = noise((fp + vec2(0.0, e)) * 1.6) + noise((fp + vec2(0.0, e)) * 3.4 + 1.3) * 0.5;
        vec3 N = normalize(vec3((hA - hX) * 0.9, 1.0, (hA - hZ) * 0.9));
        vec3 V = normalize(uCam - vW);
        vec3 L = normalize(vec3(-0.35, 0.8, -0.48));
        float spec = smoothstep(0.55, 1.0, pow(max(dot(reflect(-V, N), L), 0.0), 90.0));
        float d = depth * uDeepen;
        vec3 shallow = vec3(0.47, 0.84, 0.76), mid = vec3(0.13, 0.62, 0.64), deep = vec3(0.09, 0.30, 0.37);
        vec3 col = mix(shallow, mid, smoothstep(0.0, 0.7, d));
        col = mix(col, deep, smoothstep(0.7, 2.2, d));
        float a = mix(0.35, 0.93, smoothstep(0.0, 1.1, d));
        // shoreline foam: a wavering white line hugging the bank
        float shoreLine = smoothstep(0.035, 0.0, abs(depth - 0.1 - 0.05 * sin(uTime * 1.3 + n1 * 7.0)));
        float shore = smoothstep(0.08, 0.0, depth) * 0.8;
        // churning foam below the falls: bubbly voronoi web + solid white near the impact
        float fd = distance(vW.xz, uFall.xy);
        float fm = 1.0 - smoothstep(0.3, uFall.z, fd * 1.25 + (n2 - 0.5) * 1.6);
        vec2 vo = voronoi((vW.xz + vec2(0.0, -uTime * 0.35)) * 3.4, uTime * 1.5);
        float web = (1.0 - smoothstep(0.0, 0.05 + fm * 0.1, vo.y - vo.x)) * smoothstep(0.1, 0.5, fm);
        float foam = web * smoothstep(0.0, 0.35, fm) + smoothstep(0.55, 0.9, fm);
        // drifting streaks that show the current
        vec2 fd2 = normalize(uFlow); vec2 sp = vec2(dot(fp, vec2(fd2.y, -fd2.x)) * 3.2, dot(fp, fd2) * 0.35);
        float sn = noise(sp + n1 * 0.6);
        float streak = (smoothstep(0.62, 0.68, sn) - smoothstep(0.7, 0.78, sn)) * 0.16;
        float white = clamp(max(max(shoreLine, shore), foam) + streak + spec, 0.0, 1.0);
        col = mix(col, vec3(0.97, 1.0, 1.0), white);
        gl_FragColor = vec4(col, clamp(max(a, white), 0.0, 0.98) * smoothstep(-0.02, 0.03, depth));
      }`,
  });
}
// where the river reaches the lip, and where the falling water lands
let lipZ = -9;
for (let z = -9; z < 2; z += 0.02) { if (H(6.5, z) < 0.3) { lipZ = z - 0.15; break; } }
let baseZ = lipZ;
for (let z = lipZ; z < 4; z += 0.02) { if (H(6.5, z) < POOL_Y - 0.1) { baseZ = z; break; } }
const FALL_X = 6.5, FALL_W = 4.4;
{
  const up = new THREE.Mesh(new THREE.PlaneGeometry(14, lipZ + 46).rotateX(-Math.PI / 2).translate(6.5, RIVER_Y, (lipZ - 46) / 2 + 0.06),
    waterMaterial({ level: RIVER_Y, flow: [0.05, 1.1], fall: [999, 999, 1], deepen: 2.2 }));
  const low = new THREE.Mesh(new THREE.PlaneGeometry(56, 52).rotateX(-Math.PI / 2).translate(18, POOL_Y, 18 + lipZ / 2),
    waterMaterial({ level: POOL_Y, flow: [0.25, 0.4], fall: [FALL_X, baseZ + 0.7, 4.2], deepen: 1.3 }));
  up.renderOrder = low.renderOrder = 2;
  scene.add(up, low);
}
// the falling sheet
const fallMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  uniforms: { uTime },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; varying vec2 vUv;
    ${NOISE_GLSL}
    void main(){
      float t = 1.0 - vUv.y;
      float s = noise(vec2(vUv.x * 22.0, t * 2.2 - uTime * 2.4)) * 0.6 + noise(vec2(vUv.x * 55.0, t * 4.5 - uTime * 3.6)) * 0.4;
      vec3 col = mix(vec3(0.16, 0.40, 0.45), vec3(0.93, 0.98, 1.0), smoothstep(0.3, 0.72, s + t * 0.35));
      col = mix(col, vec3(1.0), smoothstep(0.025, 0.0, t) * 0.9);
      col = mix(col, vec3(1.0), smoothstep(0.55, 1.0, t));
      float edge = smoothstep(0.0, 0.1, vUv.x) * smoothstep(1.0, 0.9, vUv.x);
      float a = (0.72 + 0.28 * s) * edge * smoothstep(1.0, 0.92, t + (s - 0.5) * 0.12);
      gl_FragColor = vec4(col, a);
    }`,
});
{
  const g = new THREE.PlaneGeometry(1, 1, 16, 28);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) + 0.5, t = 0.5 - p.getY(i);
    const x = FALL_X + (u - 0.5) * FALL_W * (1 + t * 0.12) + Math.sin(u * 9) * 0.06;
    const y = lerp(RIVER_Y + 0.02, POOL_Y - 0.05, t);
    const z = lipZ + 0.05 + (baseZ - lipZ + 0.55) * Math.pow(t, 0.55);
    p.setXYZ(i, x, y, z);
  }
  const fall = new THREE.Mesh(g, fallMat);
  fall.renderOrder = 3;
  scene.add(fall);
}
// mist and spray at the foot of the falls
const MIST = 160;
const mist = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const x = cv.getContext('2d'); const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MIST * 3), 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ map: new THREE.CanvasTexture(cv), size: 1.1, transparent: true, opacity: 0.45, depthWrite: false }));
  pts.renderOrder = 4; pts.frustumCulled = false;
  scene.add(pts);
  const ps = Array.from({ length: MIST }, () => ({ life: rand() * 2, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 }));
  return { geo, ps };
})();
function updateMist(dt) {
  const a = mist.geo.attributes.position;

    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.56, 8), pants); l.position.y = -0.28; leg.add(l);
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 0.26), boot); f.position.set(0, -0.56, 0.05); leg.add(f);
    player.add(leg); parts[s < 0 ? 'legL' : 'legR'] = leg;
    const arm = new THREE.Group(); arm.position.set(s * 0.36, 1.18, 0);
    const a = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.5, 8), shirt); a.position.y = -0.25; arm.add(a);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 6), skin); hand.position.y = -0.52; arm.add(hand);
    player.add(arm); parts[s < 0 ? 'armL' : 'armR'] = arm;
  }
  // a fishing rod slung over the shoulder, for company
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.028, 2.2, 6), lam('#3b2d22'));
  rod.position.set(0.25, 1.35, -0.25); rod.rotation.set(-0.9, 0, -0.35);
  player.add(rod);
  player.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  player.position.set(START.x, H(START.x, START.z), START.z);
  scene.add(player);
}
const canStand = (x, z) => x > EXT.x0 + 6 && x < EXT.x0 + EXT.w - 6 && z > EXT.z0 + 6 && z < EXT.z0 + EXT.d - 6 &&
  H(x, z) > 1.6 && slopeAt(x, z) < 0.9 && !solids.some((s) => Math.hypot(s.x - x, s.z - z) < s.r + 0.3);

/* ---------- sound: falling water that swells as you get closer, and the odd bird ---------- */
let ac = null, master = null, fallGain = null, soundOn = true;
try { soundOn = localStorage.getItem('waterfall-meadow-sound') !== 'off'; } catch (e) { /* storage blocked */ }
function initAudio() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = soundOn ? 0.9 : 0; master.connect(ac.destination);
    const len = ac.sampleRate * 4, buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b0 = 0.99765 * b0 + w * 0.099; b1 = 0.963 * b1 + w * 0.2965; b2 = 0.57 * b2 + w * 1.0526; d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.12; }
    }
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    fallGain = ac.createGain(); fallGain.gain.value = 0;
    src.connect(lp); lp.connect(fallGain); fallGain.connect(master); src.start();
  } catch (e) { ac = null; }
}
function chirp() {
  if (!ac) return;
  const t0 = ac.currentTime, base = rr(2600, 3800), n = 2 + Math.floor(rand() * 3);
  for (let i = 0; i < n; i++) {
    const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * rr(0.09, 0.16);
    o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * rr(1.15, 1.45), t + 0.07);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.12);
  }
}
function setSound(on) {
  soundOn = on;
  if (master) master.gain.value = on ? 0.9 : 0;
  try { localStorage.setItem('waterfall-meadow-sound', on ? 'on' : 'off'); } catch (e) { /* ignore */ }
  $('sound').setAttribute('aria-pressed', String(on));
  $('sound').innerHTML = on
    ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
    : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
}
setSound(soundOn);
$('sound').addEventListener('click', () => { initAudio(); setSound(!soundOn); });

/* ---------- input ---------- */
const keys = {};
let started = false;
addEventListener('keydown', (e) => {
  if (!started) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); start(); } return; }
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const cv = renderer.domElement;
cv.addEventListener('wheel', (e) => { zoom = clamp(zoom + e.deltaY * 0.001, 0.55, 1.6); }, { passive: true });
const stick = { id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
cv.addEventListener('pointerdown', (e) => {
  if (!isTouch || stick.id !== null || !started) return;
  stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; stick.dx = stick.dy = 0;
  const s = $('stick'); s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px'; s.classList.add('on'); s.firstElementChild.style.transform = '';
});
addEventListener('pointermove', (e) => {
  if (e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy; const d = Math.hypot(dx, dy), max = 45;
  if (d > max) { dx *= max / d; dy *= max / d; }
  stick.dx = dx / max; stick.dy = dy / max;
  $('stick').firstElementChild.style.transform = `translate(${dx}px, ${dy}px)`;
});
const endStick = (e) => { if (e.pointerId !== stick.id) return; stick.id = null; stick.dx = stick.dy = 0; $('stick').classList.remove('on'); };
addEventListener('pointerup', endStick); addEventListener('pointercancel', endStick);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
function start() { if (started) return; started = true; $('intro').classList.remove('show'); initAudio(); }
$('startBtn').addEventListener('click', start);

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3(START.x, 1.5, START.z);
const tmp = new THREE.Vector3();
let facing = 0.6, walkPh = 0, walked = 0, chirpT = 3, fpsAcc = 0, fpsN = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = (uTime.value += dt);

  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz -= 1;
  if (keys.KeyS || keys.ArrowDown) mz += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (stick.id !== null) { mx += stick.dx; mz += stick.dy; }
  const ml = Math.hypot(mx, mz);
  let moving = false;
  if (started && ml > 0.15) {
    const sp = 3.4 * Math.min(1, ml), nx = mx / ml, nz = mz / ml;
    const px = player.position.x + nx * sp * dt, pz = player.position.z + nz * sp * dt;
    if (canStand(px, pz)) { player.position.x = px; player.position.z = pz; moving = true; }
    else if (canStand(px, player.position.z)) { player.position.x = px; moving = true; }
    else if (canStand(player.position.x, pz)) { player.position.z = pz; moving = true; }
    facing = angLerp(facing, Math.atan2(nx, nz), Math.min(1, dt * 12));
    if (moving && (walked += sp * dt) > 4) $('hint').style.opacity = 0;
  }
  player.rotation.y = facing;
  player.position.y = lerp(player.position.y, H(player.position.x, player.position.z), Math.min(1, dt * 14));
  walkPh += moving ? dt * 9 : 0;
  const sw = moving ? Math.sin(walkPh) * 0.6 : 0;
  parts.legL.rotation.x = sw; parts.legR.rotation.x = -sw;
  parts.armL.rotation.x = -sw * 0.7; parts.armR.rotation.x = sw * 0.7;
  uPlayer.value.set(player.position.x, player.position.z);

  updateMist(dt);
  for (const b of butterflies) {
    b.h += (Math.sin(t * 0.7 + b.ph) * 1.4) * dt;
    if (Math.hypot(b.x - b.cx, b.z - b.cz) > 6) b.h = angLerp(b.h, Math.atan2(b.cx - b.x, b.cz - b.z), dt * 2);
    b.x += Math.sin(b.h) * 1.2 * dt; b.z += Math.cos(b.h) * 1.2 * dt;
    b.g.position.set(b.x, Math.max(H(b.x, b.z), 1.5) + 0.9 + Math.sin(t * 2.3 + b.ph) * 0.3, b.z);
    b.g.rotation.y = b.h;
    const flap = Math.sin(t * 18 + b.ph) * 1.1;
    b.wl.rotation.z = flap; b.wr.rotation.z = -flap;
  }

  camTarget.lerp(tmp.set(player.position.x, player.position.y, player.position.z), Math.min(1, dt * 3.5));
  camera.position.copy(camTarget).addScaledVector(CAM_OFF, zoom * aspectZoom());
  camera.lookAt(camTarget);
  sun.position.copy(camTarget).add(SUN_OFF);
  sun.target.position.copy(camTarget);

  if (ac && fallGain) {
    const d = Math.hypot(player.position.x - FALL_X, player.position.z - lipZ);
    fallGain.gain.value = lerp(fallGain.gain.value, 0.12 + 0.9 * (1 - smooth(2, 26, d)), 0.05);
    if ((chirpT -= dt) <= 0) { chirpT = rr(2.5, 7); chirp(); }
  }

  renderer.render(scene, camera);
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { $('stats').textContent = `FPS ${Math.round(fpsN / fpsAcc)}`; fpsAcc = fpsN = 0; }
  requestAnimationFrame(frame);
}
renderer.compile(scene, camera);
requestAnimationFrame(frame);
const sb = $('startBtn'); sb.disabled = false; sb.textContent = '出發散步';
window.__scene = { player, H, lipZ, baseZ };
</script>
