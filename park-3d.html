<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afternoon Park — 3D</title>
<meta name="description" content="用 Three.js 重現的午後公園插畫：蜿蜒小徑、木柵欄、樹影與騎單車的人。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* pale goose-yellow paper, kept in both colour schemes so the piece always reads as a sunny print */
  --paper: #fbf4d8;
  --paper-deep: #f3e7b9;
  --ink: #5e5440;
  --ink-soft: #8f8265;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 40%, var(--paper) 0%, var(--paper-deep) 100%);
  color: var(--ink);
  font-family: 'Noto Sans TC', sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 28px 16px 24px;
  overflow-x: hidden;
}
.back {
  position: fixed; top: 16px; left: 16px;
  font-size: 0.8rem; color: var(--ink-soft); text-decoration: none;
  letter-spacing: 0.04em;
}
.back:hover { color: var(--ink); }
.quote {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: clamp(1rem, 2.6vw, 1.25rem);
  color: var(--ink-soft); margin-bottom: 18px; text-align: center;
}
.frame-wrap {
  width: min(100%, 560px, calc((100vh - 140px) * 0.81));
  aspect-ratio: 1206 / 1487;
  filter: drop-shadow(0 18px 28px rgba(60, 50, 30, 0.22)) drop-shadow(0 2px 4px rgba(60, 50, 30, 0.18));
}
.frame {
  width: 100%; height: 100%; position: relative;
  -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
  background: #b8cf72;
}
.frame canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; cursor: grab; }
.frame canvas:active { cursor: grabbing; }
.loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: 'Cormorant Garamond', serif; font-style: italic; color: #4c6a2c;
  transition: opacity .8s ease;
}
.controls {
  margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
}
.hint { margin-top: 10px; font-size: 0.75rem; color: var(--ink-soft); letter-spacing: 0.06em; text-align: center; }
.music.next { padding: 7px 14px; }
.song-name { font-family: 'Cormorant Garamond', 'Noto Sans TC', serif; font-size: 0.95rem; color: var(--ink-soft); letter-spacing: 0.04em; }
.music {
  font: 500 0.8rem 'Noto Sans TC', sans-serif; letter-spacing: 0.06em;
  color: var(--ink); background: rgba(255, 255, 255, 0.45);
  border: 1px solid rgba(94, 84, 64, 0.28); border-radius: 999px;
  padding: 7px 16px 7px 12px; min-height: 36px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  transition: background .3s ease, border-color .3s ease;
}
.music:hover { background: rgba(255, 255, 255, 0.75); }
.music:focus-visible { outline: 2px solid #8a9a3c; outline-offset: 2px; }
.music .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.music .bars i { width: 2px; height: 4px; background: currentColor; border-radius: 1px; opacity: 0.7; }
.music[aria-pressed="true"] { background: rgba(255, 255, 255, 0.8); border-color: rgba(94, 84, 64, 0.45); }
.music[aria-pressed="true"] .bars i { animation: bar 1.6s ease-in-out infinite; }
.music[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: -0.5s; }
.music[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: -1.0s; }
@keyframes bar { 0%, 100% { height: 3px; } 50% { height: 12px; } }
@media (prefers-reduced-motion: reduce) { .music .bars i { animation: none !important; } }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<a class="back" href="index.html">← Portfolio</a>

<div class="frame-wrap">

  </div>
</div>
<div class="controls">

  </button>
  <button class="music next" id="next-song" type="button" aria-label="換一首">換一首 ›</button>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const frame = document.getElementById('frame');
const isMobile = matchMedia('(max-width: 700px)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- deterministic randomness + noise ---------- */
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const rr = (a, b) => a + (b - a) * rand();
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * 0.55 + vnoise(x * 2.1, y * 2.1) * 0.3 + vnoise(x * 4.3, y * 4.3) * 0.15;
const heightAt = (x, z) => (fbm(x * 0.06 + 3, z * 0.06 + 9) - 0.5) * 1.4 + z * -0.02;

/* ---------- deckle (torn paper) edge mask ---------- */
(function deckle() {
  const W = 1206, H = 1487, inset = 22;
  const pts = [];
  const edge = (x0, y0, x1, y1, n) => {
    for (let i = 0; i < n; i++) {
      const t = i / n;
      const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
      const nx = -(y1 - y0), ny = x1 - x0, len = Math.hypot(nx, ny);
      const j = (Math.sin(t * 37 + x0) * 0.4 + (rand() - 0.5) * 1.1 + Math.sin(t * 9 + y0) * 0.6) * 9;
      pts.push([x + nx / len * j, y + ny / len * j]);
    }
  };
  edge(inset, inset, W - inset, inset, 70);
  edge(W - inset, inset, W - inset, H - inset, 86);
  edge(W - inset, H - inset, inset, H - inset, 70);
  edge(inset, H - inset, inset, inset, 86);
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="#000"/></svg>`;
  const url = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
  frame.style.webkitMaskImage = url; frame.style.maskImage = url;
})();

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
frame.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#b9cf78');
scene.fog = new THREE.Fog('#d9e4ad', 70, 150);

const camera = new THREE.PerspectiveCamera(30, 1206 / 1487, 0.5, 200);
camera.position.set(11, 42, 31);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.5, 0, 0.5);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 26; controls.maxDistance = 64;
controls.minPolarAngle = 0.35; controls.maxPolarAngle = 1.05;
controls.rotateSpeed = 0.5;
controls.update();

/* ---------- lighting: warm low sun + sky/ground bounce ---------- */
const hemi = new THREE.HemisphereLight('#fff6dc', '#5f7f2e', 1.35);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff0d2', 3.1);
sun.position.set(14, 26, -12);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 2048 : 4096, isMobile ? 2048 : 4096);
const sc = sun.shadow.camera; sc.left = -26; sc.right = 26; sc.top = 26; sc.bottom = -26; sc.near = 1; sc.far = 80;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.035;
sun.shadow.radius = 3;
scene.add(sun);
// soft cool fill from the opposite side so shadows are never black
const fill = new THREE.DirectionalLight('#cfe3ff', 0.35);
fill.position.set(-10, 12, 14);
scene.add(fill);

/* ---------- shared wind uniform ---------- */
const wind = { value: 0 };
const WIND_DIR = new THREE.Vector2(0.92, 0.39).normalize();
// Gusts: bands of stronger wind rolling across the park, with calmer lulls between.
// Mirrored in JS (gustAt) so drifting leaves ride the same gusts the grass shows.
const WIND_GLSL = `
  uniform float uTime;
  const vec2 windDir = vec2(${WIND_DIR.x.toFixed(4)}, ${WIND_DIR.y.toFixed(4)});
  float gust(vec2 p) {
    float along = dot(p, windDir), across = dot(p, vec2(-windDir.y, windDir.x));
    float band = sin(along * 0.23 - uTime * 1.45 + sin(across * 0.17) * 1.4) * 0.5 + 0.5;
    float swell = sin(along * 0.06 + across * 0.05 - uTime * 0.5) * 0.5 + 0.5;
    return 0.22 + band * band * (0.6 + swell * 1.1);
  }`;
function gustAt(x, z, t) {
  const along = x * WIND_DIR.x + z * WIND_DIR.y, across = -x * WIND_DIR.y + z * WIND_DIR.x;
  const band = Math.sin(along * 0.23 - t * 1.45 + Math.sin(across * 0.17) * 1.4) * 0.5 + 0.5;
  const swell = Math.sin(along * 0.06 + across * 0.05 - t * 0.5) * 0.5 + 0.5;
  return 0.22 + band * band * (0.6 + swell * 1.1);
}
function addWind(material, strength) {
  const patch = shader => {
    shader.uniforms.uTime = wind;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        ${WIND_GLSL}
        attribute vec3 sphereNormal;
        attribute float sway;`)
      .replace('#include <beginnormal_vertex>', `vec3 objectNormal = normalize(mix(normal, sphereNormal, 0.82));
        #ifdef USE_TANGENT
          vec3 objectTangent = vec3( tangent.xyz );
        #endif`)
      .replace('#include <begin_vertex>', `vec3 transformed = vec3(position);
        float ph = position.x * 0.45 + position.z * 0.35;
        transformed.x += sin(uTime * 1.3 + ph) * ${strength.toFixed(3)} * sway;
        transformed.z += cos(uTime * 1.05 + ph * 1.3) * ${(strength * 0.7).toFixed(3)} * sway;
        transformed.y += sin(uTime * 2.1 + ph * 2.0) * ${(strength * 0.35).toFixed(3)} * sway;
        // whole crown leans downwind in gusts, outer leaves flutter faster
        float g = gust(position.xz);
        transformed.xz += windDir * g * ${(strength * 2.2).toFixed(3)} * sway;
        transformed += vec3(sin(uTime * 7.0 + ph * 5.0), cos(uTime * 6.3 + ph * 4.0), sin(uTime * 5.7 + ph * 3.0))
                       * ${(strength * 0.45).toFixed(3)} * g * sway;`);
  };
  material.onBeforeCompile = patch;
  return patch;
}
// Instanced grass & flowers: bend in world space so every tuft follows the same gust field.
function addGrassWind(material, amount, bendExpr) {
  material.onBeforeCompile = shader => {
    shader.uniforms.uTime = wind;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        ${WIND_GLSL}`)
      .replace('#include <project_vertex>', `
        vec4 root = modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        vec4 wpos = modelMatrix * instanceMatrix * vec4(transformed, 1.0);
        float bend = ${bendExpr};
        float g = gust(root.xz);
        float flick = sin(uTime * 3.3 + root.x * 1.7 + root.z * 1.3) * 0.3 + sin(uTime * 5.1 + root.z * 2.9) * 0.15;
        wpos.xz += windDir * (g + flick * (0.4 + g)) * bend * ${amount.toFixed(3)};
        wpos.y -= g * g * bend * ${(amount * 0.3).toFixed(3)};
        #ifdef USE_COLOR
          vColor.rgb *= 1.0 + g * bend * 0.22; // blades flash lighter as a gust lays them over
        #endif
        vec4 mvPosition = viewMatrix * wpos;
        gl_Position = projectionMatrix * mvPosition;`);
  };
}

/* ---------- textures drawn on canvas ---------- */
function leafTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.translate(64, 64);
  // 3 overlapping pointed lobes give an illustrated "leaf cluster" silhouette
  const lobe = (rot, len, wid, shade) => {
    g.save(); g.rotate(rot);
    g.beginPath();
    g.moveTo(0, 6);
    g.bezierCurveTo(wid, -len * 0.25, wid * 0.7, -len * 0.8, 0, -len);
    g.bezierCurveTo(-wid * 0.7, -len * 0.8, -wid, -len * 0.25, 0, 6);
    const grd = g.createLinearGradient(0, 0, 0, -len);
    grd.addColorStop(0, `rgb(${shade - 40},${shade - 40},${shade - 40})`);
    grd.addColorStop(0.6, `rgb(${shade},${shade},${shade})`);
    grd.addColorStop(1, `rgb(${shade - 15},${shade - 15},${shade - 15})`);
    g.fillStyle = grd; g.fill();
    g.lineWidth = 2.2; g.strokeStyle = 'rgba(40,40,40,0.55)'; g.stroke();
    g.beginPath(); g.moveTo(0, 2); g.lineTo(0, -len * 0.85);
    g.lineWidth = 1.4; g.strokeStyle = 'rgba(60,60,60,0.45)'; g.stroke();
    g.restore();
  };
  lobe(-0.9, 46, 20, 225); lobe(0.9, 46, 20, 225); lobe(0, 58, 23, 255);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function radialTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 4, 64, 64, 64);
  grd.addColorStop(0, 'rgba(0,0,0,0.55)'); grd.addColorStop(0.5, 'rgba(0,0,0,0.25)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const leafTex = leafTexture();
const aoTex = radialTexture();

/* ---------- path ---------- */
const pathCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(20, 0, 15), new THREE.Vector3(12, 0, 10.5), new THREE.Vector3(5, 0, 7.5),
  new THREE.Vector3(-0.5, 0, 5.2), new THREE.Vector3(-4.5, 0, 2), new THREE.Vector3(-6.5, 0, -2.5),
  new THREE.Vector3(-9.5, 0, -6), new THREE.Vector3(-15, 0, -8), new THREE.Vector3(-24, 0, -9)
], false, 'catmullrom', 0.5);
const PATH_W = 1.55;
const pathPts = pathCurve.getSpacedPoints(500);
function distToPath(x, z) {
  let m = Infinity;
  for (let i = 0; i < pathPts.length; i += 2) { const p = pathPts[i]; const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < m) m = d; }
  return Math.sqrt(m);
}

/* ---------- ground with painterly vertex colors ---------- */
{
  const size = 70, seg = isMobile ? 160 : 220;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
  const light = new THREE.Color('#c3d67a'), mid = new THREE.Color('#9fbf55'), deep = new THREE.Color('#7d9f3f'), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const dp = distToPathFast(x, z);
    let y = heightAt(x, z);
    // carve a gentle bed for the path
    const bed = THREE.MathUtils.smoothstep(dp, PATH_W * 0.6, PATH_W + 1.2);
    y -= (1 - bed) * 0.06;
    pos.setY(i, y);
    const n = fbm(x * 0.18, z * 0.18), n2 = vnoise(x * 1.3, z * 1.3);
    c.copy(mid).lerp(light, THREE.MathUtils.smoothstep(n, 0.35, 0.7));
    c.lerp(deep, THREE.MathUtils.smoothstep(n2, 0.75, 1.0) * 0.5);
    // worn grass along the path edges
    const worn = 1 - THREE.MathUtils.smoothstep(dp, PATH_W, PATH_W + 0.9);
    c.lerp(new THREE.Color('#d2d495'), worn * 0.45);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  ground.receiveShadow = true;
  scene.add(ground);
}
// coarse lookup so the 50k ground vertices don't each scan the whole path
function distToPathFast(x, z) {
  let m = Infinity;
  for (let i = 0; i < pathPts.length; i += 5) { const p = pathPts[i]; const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < m) m = d; }
  return Math.sqrt(m);
}

/* ---------- path ribbon with soft feathered edges ---------- */
{
  const N = 420, across = 6;
  const verts = [], cols = [], idx = [];
  const base = new THREE.Color('#ead9b6'), edgeC = new THREE.Color('#d9cf9c'), c = new THREE.Color();
  const up = new THREE.Vector3(0, 1, 0), side = new THREE.Vector3();
  for (let i = 0; i <= N; i++) {
    const t = i / N, p = pathCurve.getPointAt(t), tan = pathCurve.getTangentAt(t);
    side.crossVectors(up, tan).normalize();
    const wobble = 1 + (vnoise(t * 40, 2) - 0.5) * 0.12;
    for (let j = 0; j <= across; j++) {
      const s = (j / across) * 2 - 1;
      const w = PATH_W * wobble * (Math.abs(s) > 0.66 ? 1.0 + (Math.abs(s) - 0.66) * 0.5 : 1) * s;
      const x = p.x + side.x * w, z = p.z + side.z * w;
      const y = heightAt(x, z) - 0.06 + 0.075 - Math.abs(s) * 0.03;
      verts.push(x, y, z);
      const sh = vnoise(x * 2.2, z * 2.2) * 0.08 + vnoise(x * 7, z * 7) * 0.05;
      c.copy(base).lerp(edgeC, Math.max(0, Math.abs(s) - 0.55) * 1.6).offsetHSL(0, 0, -sh);
      cols.push(c.r, c.g, c.b, Math.abs(s) > 0.84 ? 0 : 1);
    }
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < across; j++) {
    const a = i * (across + 1) + j, b = a + across + 1;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 4));
  geo.setIndex(idx); geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, transparent: true, roughness: 1, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
  const path = new THREE.Mesh(geo, mat);
  path.receiveShadow = true; path.renderOrder = 1;
  scene.add(path);
}

/* ---------- foliage builder: leaf cards on sphere clumps, normals bent outward ---------- */
const leafParts = [];
function addClump(cx, cy, cz, r, count, color, sway = 1) {
  const g = new THREE.PlaneGeometry(1, 1);
  const tmp = new THREE.Object3D(), dir = new THREE.Vector3(), cBase = new THREE.Color(color), c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    // bias points toward the surface, flatter bottom
    dir.set(rr(-1, 1), rr(-0.7, 1), rr(-1, 1)).normalize();
    const d = r * Math.pow(rand(), 0.35);
    const px = cx + dir.x * d, py = cy + dir.y * d * 0.82, pz = cz + dir.z * d;
    const s = rr(0.6, 0.95) * (r > 1.6 ? 1.1 : 0.85);
    tmp.position.set(px, py, pz);
    tmp.rotation.set(rr(0, Math.PI * 2), rr(0, Math.PI * 2), rr(0, Math.PI * 2));
    tmp.scale.set(s, s, s);
    tmp.updateMatrix();
    const leaf = g.clone().applyMatrix4(tmp.matrix);
    const n = new THREE.Vector3(px - cx, (py - cy) * 1.2 + r * 0.25, pz - cz).normalize();
    const sn = new Float32Array(12), cl = new Float32Array(12), sw = new Float32Array(4);
    // top & outer leaves pick up more yellow; inner ones go deeper
    const outer = d / r;
    c.copy(cBase).offsetHSL(rr(-0.015, 0.02), rr(-0.05, 0.05), rr(-0.06, 0.05) + (outer - 0.7) * 0.08 + dir.y * 0.04);
    for (let k = 0; k < 4; k++) {
      sn[k * 3] = n.x; sn[k * 3 + 1] = n.y; sn[k * 3 + 2] = n.z;
      cl[k * 3] = c.r; cl[k * 3 + 1] = c.g; cl[k * 3 + 2] = c.b;
      sw[k] = sway * (0.6 + outer * 0.6);
    }
    leaf.setAttribute('sphereNormal', new THREE.BufferAttribute(sn, 3));
    leaf.setAttribute('color', new THREE.BufferAttribute(cl, 3));

const barkMat = new THREE.MeshStandardMaterial({ color: '#2e2b27', roughness: 0.9 });

function addBranch(from, to, r0, r1) {
  const mid = from.clone().lerp(to, 0.5).add(new THREE.Vector3(rr(-0.3, 0.3), rr(0, 0.3), rr(-0.3, 0.3)));
  const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
  const geo = new THREE.TubeGeometry(curve, 10, 1, 8, false);
  // taper the tube
  const p = geo.attributes.position, n = geo.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const ring = Math.floor(i / 9) / 10, rad = THREE.MathUtils.lerp(r0, r1, ring);
    const ct = curve.getPoint(ring);
    p.setXYZ(i, ct.x + n.getX(i) * rad, ct.y + n.getY(i) * rad, ct.z + n.getZ(i) * rad);
  }
  trunkParts.push(geo);
}
const aoMat = new THREE.MeshBasicMaterial({ map: aoTex, transparent: true, depthWrite: false, color: '#203010', opacity: 0.85 });
function addContactShadow(x, z, r) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(r * 2, r * 2), aoMat);

function addTree(x, z, h, spread, palette, clumps = 6) {
  const y0 = heightAt(x, z);
  const base = new THREE.Vector3(x, y0 - 0.2, z);
  const top = new THREE.Vector3(x + rr(-0.6, 0.6), y0 + h * 0.62, z + rr(-0.6, 0.6));
  addBranch(base, top, 0.32 * (h / 9), 0.16 * (h / 9));
  addContactShadow(x, z, 1.6 * (h / 9) + 0.6);
  for (let i = 0; i < clumps; i++) {
    const a = (i / clumps) * Math.PI * 2 + rr(-0.4, 0.4);
    const rad = spread * rr(0.45, 0.85);
    const cx = top.x + Math.cos(a) * rad, cz = top.z + Math.sin(a) * rad;
    const cy = top.y + rr(-0.4, 1.4);
    addBranch(top.clone().add(new THREE.Vector3(0, -0.4, 0)), new THREE.Vector3(cx, cy, cz), 0.13 * (h / 9), 0.04);
    const r = spread * rr(0.55, 0.8);
    addClump(cx, cy + r * 0.3, cz, r, Math.round(r * r * 150), palette[i % palette.length]);
  }
  // crown
  addClump(top.x, top.y + spread * 0.7, top.z, spread * 0.85, Math.round(spread * spread * 130), palette[0]);
}
function addBush(x, z, r, color, n = 3) {
  const y0 = heightAt(x, z);
  addContactShadow(x, z, r * 1.5);
  for (let i = 0; i < n; i++) {
    const a = rr(0, Math.PI * 2), d = r * rr(0.1, 0.6);
    const rc = r * rr(0.6, 0.9);
    addClump(x + Math.cos(a) * d, y0 + rc * 0.75, z + Math.sin(a) * d, rc, Math.round(rc * rc * 170), color, 0.6);
  }
}

// post-and-rail fence following both sides of the path
function railFence(offset, t0, t1, spacing = 1.9) {
  const L = pathCurve.getLength();
  const n = Math.floor(((t1 - t0) * L) / spacing);
  const up = new THREE.Vector3(0, 1, 0), side = new THREE.Vector3();
  let prev = null;
  for (let i = 0; i <= n; i++) {
    const t = t0 + (t1 - t0) * (i / n);
    const p = pathCurve.getPointAt(t), tan = pathCurve.getTangentAt(t);
    side.crossVectors(up, tan).normalize();
    const x = p.x + side.x * offset, z = p.z + side.z * offset, y = heightAt(x, z);
    box(0.09, 0.95, 0.09, x, y + 0.42, z);
    if (prev) {
      const dx = x - prev.x, dz = z - prev.z, len = Math.hypot(dx, dz);
      const ry = -Math.atan2(dz, dx), rz = Math.atan2(y - prev.y, len);
      for (const hgt of [0.42, 0.8]) box(len, 0.045, 0.045, (x + prev.x) / 2, (y + prev.y) / 2 + hgt, (z + prev.z) / 2, ry, rz);
    }
    prev = { x, y, z };
  }
}

// picket fence running diagonally across the meadow
function picketFence(points, gap = 0.24) {
  for (let s = 0; s < points.length - 1; s++) {
    const [ax, az] = points[s], [bx, bz] = points[s + 1];
    const dx = bx - ax, dz = bz - az, len = Math.hypot(dx, dz), ry = -Math.atan2(dz, dx);
    const n = Math.floor(len / gap);
    for (let i = 0; i < n; i++) {
      const t = i / n, x = ax + dx * t, z = az + dz * t, y = heightAt(x, z);
      const h = 0.95 + vnoise(x * 3, z * 3) * 0.2;
      box(0.07, h, 0.035, x, y + h / 2 - 0.05, z, ry, rr(-0.06, 0.06));
      if (i % 9 === 0) box(0.11, 1.15, 0.11, x, y + 0.5, z, ry);
    }
    for (const hgt of [0.3, 0.75]) {
      const ya = heightAt(ax, az), yb = heightAt(bx, bz);
      box(len, 0.05, 0.03, (ax + bx) / 2, (ya + yb) / 2 + hgt, (az + bz) / 2 + 0.03, ry, Math.atan2(yb - ya, len));
    }
  }
}

const drift = (() => {
  const n = isMobile ? 40 : 70;
  const geo = new THREE.PlaneGeometry(0.5, 0.5);
  const mat = new THREE.MeshStandardMaterial({ map: leafTex, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.8 });
  const mesh = new THREE.InstancedMesh(geo, mat, n);
  mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: leafTex, alphaTest: 0.45, side: THREE.DoubleSide });
  mesh.castShadow = true;
  mesh.frustumCulled = false;
  const tones = ['#6f9a3e', '#a7b84a', '#c9b45a', '#4f7d38', '#8faa45'];
  const items = [];
  const spawn = (it, anywhere) => {
    // enter upwind of the visible area, or anywhere on first fill
    it.p.set(anywhere ? rr(-22, 22) : rr(-30, -20), rr(0.6, 7), anywhere ? rr(-18, 20) : rr(-18, 22));
    it.speed = rr(0.7, 1.4); it.phase = rr(0, 6.28);
    it.spin.set(rr(-2.5, 2.5), rr(-2.5, 2.5), rr(-2.5, 2.5));
  };
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const it = { p: new THREE.Vector3(), r: new THREE.Euler(rr(0, 6), rr(0, 6), rr(0, 6)), spin: new THREE.Vector3(), s: rr(0.7, 1.3) };
    spawn(it, true); items.push(it);
    mesh.setColorAt(i, c.set(tones[i % tones.length]).offsetHSL(0, 0, rr(-0.05, 0.05)));
  }
  scene.add(mesh);
  const o = new THREE.Object3D();
  return (dt, t) => {
    for (let i = 0; i < n; i++) {
      const it = items[i], g = gustAt(it.p.x, it.p.z, t);
      const push = (0.6 + g * 2.6) * it.speed;
      it.p.x += WIND_DIR.x * push * dt;
      it.p.z += WIND_DIR.y * push * dt + Math.sin(t * 0.9 + it.phase) * 0.35 * dt;
      // gusts lift, lulls let leaves sink and flutter down
      it.p.y += ((g - 0.75) * 0.9 + Math.sin(t * 2.2 + it.phase) * 0.6) * dt;
      const ground = heightAt(it.p.x, it.p.z) + 0.05;
      if (it.p.y < ground) { it.p.y = ground; }
      const flutter = 0.4 + g;
      it.r.x += it.spin.x * flutter * dt; it.r.y += it.spin.y * flutter * dt; it.r.z += it.spin.z * flutter * dt;
      if (it.p.x > 26 || it.p.z > 24 || it.p.y > 11) spawn(it, false);
      o.position.copy(it.p); o.rotation.copy(it.r); o.scale.setScalar(it.s); o.updateMatrix();
      mesh.setMatrixAt(i, o.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  };
})();

/* ---------- post: film grade, vignette, gentle tilt-shift, grain ---------- */
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });

const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      // tilt-shift: blur grows toward top and bottom edges
      float band = smoothstep(0.18, 0.5, abs(vUv.y - 0.52));
      vec2 px = 1.0 / uRes * band * 2.2;
      vec3 col = texture2D(tDiffuse, vUv).rgb * 0.36;
      col += texture2D(tDiffuse, vUv + vec2( px.x, px.y)).rgb * 0.16;
      col += texture2D(tDiffuse, vUv + vec2(-px.x, px.y)).rgb * 0.16;
      col += texture2D(tDiffuse, vUv + vec2( px.x,-px.y)).rgb * 0.16;
      col += texture2D(tDiffuse, vUv + vec2(-px.x,-px.y)).rgb * 0.16;
      // illustration grade: warm highlights, olive-lifted shadows, slightly softened contrast
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, col * vec3(1.04, 1.01, 0.93), smoothstep(0.4, 1.0, l));
      col = mix(vec3(0.12, 0.16, 0.08), vec3(1.0), col * 0.94 + 0.04);
      col = mix(vec3(l), col, 1.06);
      // vignette
      vec2 d = vUv - 0.5; col *= 1.0 - dot(d, d) * 0.55;
      // paper grain
      float g = h(vUv * uRes + fract(uTime) * 61.0) - 0.5;
      col += g * 0.035;
      gl_FragColor = vec4(col, 1.0);
    }`
});
composer.addPass(grade);

    for (let ch = 0; ch < 2; ch++) {

      for (let i = 0; i < len; i++) {
        lp += ((Math.random() * 2 - 1) - lp) * 0.35; // darken the tail
        d[i] = lp * Math.pow(1 - i / len, 3.2) * (i < ctx.sampleRate * 0.01 ? i / (ctx.sampleRate * 0.01) : 1);
      }
    }
    return buf;
  }
  function setup() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.4;
    master = ctx.createGain(); master.gain.value = 0;
    master.connect(comp).connect(ctx.destination);
    const verb = ctx.createConvolver(); verb.buffer = makeImpulse(3.4);
    send = ctx.createGain(); send.gain.value = 0.26;
    send.connect(verb).connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // breeze: filtered noise whose level follows the same gusts that move the grass
    const wsrc = ctx.createBufferSource(); wsrc.buffer = noiseBuf; wsrc.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 480; bp.Q.value = 0.6;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    windGain = ctx.createGain(); windGain.gain.value = 0;
    wsrc.connect(bp).connect(lp).connect(windGain).connect(master);
    wsrc.start();
  }

  // One piano note: slightly inharmonic partials, paired strings that beat gently,
  // a two-stage decay, a felt-hammer thump and a tone that darkens as it rings.
  function note(midi, t, vel, hold) {
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const out = ctx.createGain();
    const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.Q.value = 0.2;
    const bright = Math.min(9000, 700 + vel * 2800 + f * 2);
    tone.frequency.setValueAtTime(bright, t);
    tone.frequency.exponentialRampToValueAtTime(Math.max(250, f * 1.4), t + 3);
    const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-0.55, Math.min(0.55, (midi - 62) / 34));
    out.connect(tone).connect(pan); pan.connect(master); pan.connect(send);
    const tau = Math.max(0.9, Math.min(5.5, 3.2 * Math.sqrt(262 / f)));
    const end = t + hold, B = 0.0004;
    for (let n = 1; n <= (midi < 50 ? 7 : 6); n++) {
      const fn = f * n * Math.sqrt(1 + B * n * n);
      if (fn > 11000) break;
      const amp = vel * 0.13 / Math.pow(n, 1.5 - vel * 0.5);
      const pair = n <= 2 ? [-0.8, 0.9] : [0];
      for (const cents of pair) {
        const a = amp / pair.length, tn = tau / (1 + (n - 1) * 0.5);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = fn; o.detune.value = cents;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(a, t + 0.006);
        g.gain.setTargetAtTime(a * 0.4, t + 0.006, 0.18);
        g.gain.setTargetAtTime(0, t + 0.25, tn);
        g.gain.setTargetAtTime(0, end, 0.14); // damper
        o.connect(g).connect(out);
        o.start(t); o.stop(Math.min(end + 1, t + 0.25 + tn * 6));
      }
    }
    const h = ctx.createBufferSource(); h.buffer = noiseBuf;
    const hf = ctx.createBiquadFilter(); hf.type = 'bandpass'; hf.frequency.value = Math.min(4000, f * 3); hf.Q.value = 1.1;
    const hg = ctx.createGain();
    hg.gain.setValueAtTime(vel * 0.035, t); hg.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    h.connect(hf).connect(hg).connect(out);
    h.start(t, Math.random()); h.stop(t + 0.06);
  }

  const human = () => (Math.random() - 0.5) * 0.018;
  function pickMelody(chord, strong) {
    const chordPc = chord.slice(1).map(m => m % 12);
    const cands = [];
    for (let m = song.range[0]; m <= song.range[1]; m++) {
      const pc = ((m - song.root) % 12 + 12) % 12;
      if (!SCALE.includes(pc)) continue;
      const dist = Math.abs(m - mel);
      if (dist > 5) continue;
      let w = 6 - dist + (dist === 0 ? -3 : 0);
      if (chordPc.includes(m % 12)) w += strong ? 5 : 1.5;
      cands.push([m, Math.max(0.3, w)]);
    }
    let r = Math.random() * cands.reduce((a, c) => a + c[1], 0);
    for (const [m, w] of cands) { if ((r -= w) <= 0) return (mel = m); }
    return mel;
  }
  const at = (t0, k) => t0 + k * EIGHTH() + (k % 2 ? song.swing * EIGHTH() : 0) + human();
  const LEFT = {
    // a light arpeggio that rises and falls like a breeze, pedalled per half bar
    breeze(t0, chord, arp) {
      const E = EIGHTH();
      note(chord[0], at(t0, 0), 0.26, BAR() * 0.55);
      const ext = [...arp, arp[0] + 12];
      const seq = [null, ext[0], ext[1], ext[2], ext[3], ext[Math.min(4, ext.length - 1)], ext[3], ext[2]];
      for (let k = 1; k < 8; k++) note(seq[k], at(t0, k), 0.13 + Math.random() * 0.05 + (k === 4 ? 0.03 : 0), (k < 4 ? 4 - k : 8 - k) * E + 0.12);
    },
    // oom-pah-pah, with the "pah"s short and soft
    waltz(t0, chord, arp) {
      note(chord[0], at(t0, 0), 0.28, BEAT() * 1.3);
      for (const k of [2, 4]) arp.slice(-3).forEach(m => note(m, at(t0, k) + Math.random() * 0.008, 0.13 + Math.random() * 0.04, EIGHTH() * 1.3));
      if (Math.random() < 0.5) note(arp[0], at(t0, 5), 0.12, EIGHTH() * 0.9);
    },
    // bass, then short skipping broken-chord notes
    skip(t0, chord, arp) {
      const E = EIGHTH();
      note(chord[0], at(t0, 0), 0.26, E * 1.6);
      note(chord[0] + 7, at(t0, 4), 0.2, E * 1.4);
      const seq = [null, arp[0], arp[1], arp[2], null, arp[1], arp[2], arp[3] ?? arp[0] + 12];
      for (let k = 1; k < 8; k++) if (seq[k]) note(seq[k], at(t0, k), 0.13 + Math.random() * 0.05, E * 0.85);
    }
  };
  function playBar(t0, i) {
    const sec = song.sections[song.order[Math.floor(i / 4) % song.order.length]];
    const chord = song.chords[sec[i % 4]], arp = chord.slice(1);
    const perBar = song.beats * 2;
    LEFT[song.left](t0, chord, arp);
    // right hand: four-bar phrases up high, a soft touch, landing on a chord tone
    if (i >= 1) {
      const phraseEnd = i % 4 === 3;
      const rhythm = phraseEnd ? song.cadence : song.rhythms[Math.floor(Math.random() * song.rhythms.length)];
      rhythm.forEach((e, idx) => {
        const gap = ((rhythm[idx + 1] ?? perBar) - e) * EIGHTH();
        const last = phraseEnd && idx === rhythm.length - 1;
        const m = pickMelody(chord, e % 2 === 0 || last);
        note(m, at(t0, e) + 0.01, 0.3 + Math.random() * 0.1 + (e % 4 === 0 ? 0.04 : 0), last ? BEAT() * 2.4 : Math.max(gap * 0.9, 0.16));
      });
    }
    // now and then a few wind-chime notes drift past, very quietly
    if (Math.random() < song.chimes) {
      const n = 1 + Math.floor(Math.random() * 3);
      for (let c = 0; c < n; c++) {
        const top = [];
        for (let m = 86; m <= 99; m++) if (SCALE.includes(((m - song.root) % 12 + 12) % 12)) top.push(m);
        note(top[Math.floor(Math.random() * top.length)], t0 + Math.random() * BAR(), 0.07 + Math.random() * 0.04, 0.9);
      }
    }
  }
  function tick() {
    while (nextBar < ctx.currentTime + 0.5) {
      if (pending) { song = pending; pending = null; bar = 0; mel = Math.round((song.range[0] + song.range[1]) / 2); nextBar += 0.35; }
      playBar(nextBar, bar++); nextBar += BAR();
    }
  }
  async function start() {
    if (!ctx) setup();
    await ctx.resume();
    if (nextBar < ctx.currentTime) nextBar = ctx.currentTime + 0.15;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(2.4, ctx.currentTime, 0.8);
    tick(); clearInterval(timer); timer = setInterval(tick, 200);
    playing = true; btn.setAttribute('aria-pressed', 'true'); label.textContent = '暫停鋼琴';
  }
  function stop() {
    playing = false; btn.setAttribute('aria-pressed', 'false'); label.textContent = '播放鋼琴';
    clearInterval(timer);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(0, ctx.currentTime, 0.35);
    setTimeout(() => { if (!playing) ctx.suspend(); }, 1600);
  }
  btn.addEventListener('click', () => (playing ? stop() : start()));
  const nextBtn = document.getElementById('next-song'), songName = document.getElementById('song-name');
  const showName = s => { songName.textContent = `${SONGS.indexOf(s) + 1}／${SONGS.length}　${s.name}`; };
  showName(song);
  nextBtn.addEventListener('click', () => {
    const target = SONGS[(SONGS.indexOf(pending || song) + 1) % SONGS.length];
    showName(target);
    if (playing) pending = target; // switch on the next bar line so nothing gets cut off
    else { song = target; bar = 0; mel = Math.round((song.range[0] + song.range[1]) / 2); }
    if (!playing) start();
  });
  // background tabs throttle timers, so pause rather than play with gaps
  document.addEventListener('visibilitychange', () => {
    if (!ctx || !playing) return;
    if (document.hidden) { clearInterval(timer); ctx.suspend(); }
    else ctx.resume().then(() => { if (nextBar < ctx.currentTime) nextBar = ctx.currentTime + 0.15; tick(); timer = setInterval(tick, 200); });
  });
  return {
    breeze(t) {
      if (!playing || t - lastWind < 0.25) return;
      lastWind = t;
      windGain.gain.setTargetAtTime(0.006 + gustAt(0, 0, t) * 0.022, ctx.currentTime, 0.5);
    }
  };
})();

/* ---------- resize / loop ---------- */
function resize() {
  const w = frame.clientWidth, h = frame.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  grade.uniforms.uRes.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
new ResizeObserver(resize).observe(frame);
resize();

const clock = new THREE.Clock();
let ride = 0.42;
const tmpV = new THREE.Vector3(), tmpT = new THREE.Vector3(), upV = new THREE.Vector3(0, 1, 0), sideV = new THREE.Vector3();
function placeRider(dt) {
  ride = (ride + dt * 0.012) % 1;
  const t = 1 - ride; // riding from the far end toward the viewer, like the illustration
  pathCurve.getPointAt(t, tmpV); pathCurve.getTangentAt(t, tmpT).negate();
  sideV.crossVectors(upV, tmpT).normalize();
  const x = tmpV.x - sideV.x * 0.55, z = tmpV.z - sideV.z * 0.55;
  rider.position.set(x, heightAt(x, z) + 0.02, z);
  rider.rotation.y = Math.atan2(-tmpT.z, tmpT.x);
  const ph = performance.now() * 0.006;
  rider.userData.legs[0].rotation.z = Math.sin(ph) * 0.5;
  rider.userData.legs[1].rotation.z = -Math.sin(ph) * 0.5;
}

let first = true;
function frameLoop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (!reduceMotion) {
    wind.value = t;
    placeRider(dt);
    drift(dt, t);
    music.breeze(t);
  } else if (first) { placeRider(0); drift(0, 0); }
  grade.uniforms.uTime.value = t;
  controls.update();
  composer.render();
  if (first) { first = false; document.getElementById('loading').style.opacity = 0; }
  if (!stillFrame || clock.elapsedTime < 0.1) requestAnimationFrame(frameLoop);
}
const stillFrame = new URLSearchParams(location.search).has('still');
frameLoop();
</script>
